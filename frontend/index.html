<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>FocusPath — habit tracker</title>
    <meta name="description" content="Track the habits you are building and the ones you are quitting, one day at a time." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- The app ships both themes, so let the browser paint its own chrome to
         match instead of assuming light. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F9FF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1420" media="(prefers-color-scheme: dark)" />

    <!-- The two faces that carry the first screen. Without these `swap` paints
         it in a fallback and then reflows once Montserrat lands. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/src/assets/fonts/Montserrat-Regular.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/src/assets/fonts/Montserrat-Medium.woff2" />
    <!-- Applies the saved theme before the first paint. React loads too late:
         without this the page renders in the device theme and then swaps once
         the app hydrates, which is a visible flash of the wrong colours on
         every load. Kept tiny and dependency-free on purpose. -->
    <script>
      (function () {
        try {
          var choice = localStorage.getItem('focuspath:theme');
          if (choice === 'light' || choice === 'dark') {
            document.documentElement.setAttribute('data-theme', choice);
          }
        } catch (e) {
          /* Private browsing can throw on access; the device theme applies. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
